[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-whisperer"
version = "0.1.0"
description = "Read the hidden training recipe off a model's weights via agent-driven activation probing; distill the inferred recipe into a student model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.3", "scipy>=1.10"]

[project.scripts]
weight-whisperer = "dataset_recipe_inferrer.run:main"
weight-whisperer-distill = "dataset_recipe_inferrer.distill:main"

[tool.setuptools]
# the repo root IS the package directory
packages = ["dataset_recipe_inferrer"]
package-dir = { "dataset_recipe_inferrer" = "." }
